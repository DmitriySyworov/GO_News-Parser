services:
  postgres-user:
    container_name: postgres-user
    image: postgres:latest
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER : ${POSTGRES_USER}
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
      POSTGRES_DB : ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      timeout: 5s
      interval: 5s
      retries: 5
    volumes:
      - ${PATH_VOLUMES}/postgres-data:/var/lib/postgresql/18/data
  redis-shared:
    container_name: redis-shared
    image: redis:8.10-rc2-alpine3.23
    ports:
      - "${EXTERNAL_SHARED_REDIS_PORT}:6379"
    command: redis-server --requirepass ${SHARED_REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${SHARED_REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ${PATH_VOLUMES}/shared-redis-data:/data
  redis-auth:
    container_name: redis-auth
    image: redis:8.10-rc2-alpine3.23
    ports:
      - "${EXTERNAL_REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ${PATH_VOLUMES}/redis-data:/data
  migration-user:
    container_name: migration-auth-user
    build:
      context: ../../
      dockerfile: ./services/auth/Dockerfile
    env_file:
      - .env
    entrypoint: ["./migrator"]
    environment:
      DSN : ${DSN}
    restart: "no"
    depends_on:
      postgres-user:
        condition: service_healthy
  app-auth-user:
    container_name: app-auth-user
    build:
      context: ../../
      dockerfile: ./services/auth/Dockerfile
    env_file:
      - .env
    ports:
      - "${EXTERNAL_API_PORT}:8080"
    environment:
      EXTERNAL_API_PORT : ${EXTERNAL_API_PORT}
      DSN : ${DSN}
      REDIS_ADDRESS : ${REDIS_ADDRESS}
      REDIS_PASSWORD : ${REDIS_PASSWORD}
      JWT_SIGNATURE : ${JWT_SIGNATURE}
      API_EMAIL : ${API_EMAIL}
      API_PASSWORD : ${API_PASSWORD}
      SMTP_ADDRESS : ${SMTP_ADDRESS}
      SMTP_ADDRESS_HOST : ${SMTP_ADDRESS_HOST}
      KAFKA_BOOTSTRAP : ${KAFKA_BOOTSTRAP}
      KAFKA_CLIENT_USER : ${KAFKA_CLIENT_USER}
      KAFKA_CLIENT_PASSWORD : ${KAFKA_CLIENT_PASSWORD}
      DELETED_USERS_TOPIC : ${DELETED_USERS_TOPIC}
      SHARED_REDIS_ADDRESS : ${SHARED_REDIS_ADDRESS}
      SHARED_REDIS_PASSWORD : ${SHARED_REDIS_PASSWORD}
    depends_on:
      migration-user:
        condition: service_completed_successfully
      redis-auth:
        condition: service_healthy
      redis-shared:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  shared-redis-data:
