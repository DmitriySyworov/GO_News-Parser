{{- range .Values.microservices }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
spec:
  replicas: {{ index $.Values.replicasCount .replicas}}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      annotations:
        timestamp: {{ now | date "20060102150405" | quote }}
      labels:
        app: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ .image }}:{{ index $.Values.versions .version}}"
          imagePullPolicy: Always
          {{ $port := index $.Values.configs .configName "EXTERNAL_API_PORT" }}
          ports:
            - containerPort: {{ $port }}
          envFrom:
            - secretRef:
               name: {{ .secretName }}
            {{- if .configName}}
            - configMapRef:
               name: {{ .configName}}
                {{- end }}
          {{- if .checkLivenessProbe }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ $port }}
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
            {{- end }}
---
{{- end }}